<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WDC Expenditure Dashboard has moved</title>
  <meta http-equiv="refresh" content="0; url=https://wdc-dashboard-production.up.railway.app/">
  <link rel="canonical" href="https://wdc-dashboard-production.up.railway.app/">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f6f3; color: #0b0b0b;
    }
    main { max-width: 480px; background: #fcfcfb; border: 1px solid rgba(11,11,11,.1); border-radius: 12px; padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #52514e; }
    a.btn { display: inline-block; background: #2a78d6; color: #fff; text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 8px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d0d0d; color: #f0efec; }
      main { background: #1a1a19; border-color: rgba(255,255,255,.1); }
      p { color: #c3c2b7; }
    }
  </style>
</head>
<body>
  <main>
    <h1>This dashboard has moved</h1>
    <p>The PCDF WDC Expenditure Dashboard now updates live from KoboToolbox at a new address. You should be redirected automatically.</p>
    <a class="btn" href="https://wdc-dashboard-production.up.railway.app/">Open the new dashboard</a>
  </main>
  <script>location.replace('https://wdc-dashboard-production.up.railway.app/' + location.hash);</script>
</body>
</html>
